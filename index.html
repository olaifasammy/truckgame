<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#0a0f1d">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="NexHaul">
  <meta name="description" content="Truck management realistic game featuring real-time logistics and authentic heavy vehicle physics." />
  <meta property="og:title" content="NexHaul Logistics" />
  <meta property="og:description" content="Truck management realistic game featuring real-time logistics and authentic heavy vehicle physics." />
  <meta property="og:type" content="website" />
  <meta name="twitter:card" content="summary_large_image" />
  <link rel="manifest" href="/manifest.json">
  <title>NexHaul Logistics</title>
</head>
<body>
  <div id="app">
    <header id="header" class="top" style="display:none"></header>
    <main id="view"></main>
    <nav id="nav" class="tabs" style="display:none"></nav>
    <div id="toast" class="toast"></div>
  </div>

  <script>
    window.addEventListener('error', function(event) {
      var view = document.getElementById('view');
      if (view) {
        view.innerHTML = '<div style="padding:20px;color:#ef4444;background:#111;min-height:100vh;font-family:monospace;font-size:12px;overflow:auto;">' +
          '<h3 style="margin:0 0 10px 0;color:#ef4444;">CRASH ERROR BOUNDARY</h3>' +
          '<p><b>Message:</b> ' + event.message + '</p>' +
          '<p><b>File:</b> ' + event.filename + ':' + event.lineno + '</p>' +
          '<pre style="white-space:pre-wrap;background:#222;padding:10px;border-radius:4px;">' + (event.error ? event.error.stack : 'No stack trace') + '</pre>' +
          '<button onclick="localStorage.clear();location.reload();" style="margin-top:10px;padding:8px 16px;background:#c19a5b;color:#0a0f1d;border:none;border-radius:4px;font-weight:bold;cursor:pointer;">Clear Storage & Reboot</button>' +
          '</div>';
      }
    });
    window.addEventListener('unhandledrejection', function(event) {
      var view = document.getElementById('view');
      if (view) {
        view.innerHTML = '<div style="padding:20px;color:#ef4444;background:#111;min-height:100vh;font-family:monospace;font-size:12px;overflow:auto;">' +
          '<h3 style="margin:0 0 10px 0;color:#ef4444;">UNHANDLED PROMISE REJECTION</h3>' +
          '<pre style="white-space:pre-wrap;background:#222;padding:10px;border-radius:4px;">' + (event.reason ? (event.reason.stack || event.reason) : 'Unknown rejection') + '</pre>' +
          '<button onclick="localStorage.clear();location.reload();" style="margin-top:10px;padding:8px 16px;background:#c19a5b;color:#0a0f1d;border:none;border-radius:4px;font-weight:bold;cursor:pointer;">Clear Storage & Reboot</button>' +
          '</div>';
      }
    });
  </script>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
